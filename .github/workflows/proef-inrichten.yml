name: Proef inrichten

# Richt de Cloudflare-proef in (of ruimt hem op), met beheer/inrichten-cloudflare.mjs.
# Alleen met de hand te starten, alleen vanaf main, en alleen in de GitHub-omgeving
# proef-beheer: daar staan de brede sleutels (Cloudflare Access, Supabase Management,
# GitHub-schrijfrechten). Een pull request draait deze workflow nooit en ziet die
# sleutels dus ook nooit. Zie beheer/README.md.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Naam van de app in beheer/toegang.json
        type: string
        default: cf-proef
      droogloop:
        description: Alleen kijken en de geplande stappen tonen, niets wijzigen
        type: boolean
        default: true
      opruimen:
        description: Alles met het voorvoegsel cf-proef- verwijderen
        type: boolean
        default: false
      tweede_doorgang:
        description: Alleen Access op de Worker zetten (na de eerste uitrol)
        type: boolean
        default: false
      deur_weghalen:
        # Alleen voor een klantportaal, en alleen nadat een run zonder dit vinkje alles heeft
        # klaargezet en het inloggen per mail achter de deur is getest. Zonder dit vinkje
        # verandert geen enkele run iets aan de deur; met dit vinkje verandert een run alleen
        # de deur. Zie "Klantportaal" in beheer/README.md.
        description: Deur weghalen (klantportaal live zetten)
        type: boolean
        default: false

concurrency:
  # Nooit twee inrichtingen tegelijk.
  group: proef-beheer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inrichten:
    name: Inrichten
    # Alleen in de template zelf: een app uit de template krijgt deze workflow bij de
    # Initial commit nog even mee, en zou anders een lege omgeving proef-beheer aanmaken.
    if: github.repository == 'Stage-Two-AI/app-template-tier2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: proef-beheer
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Inrichten
        env:
          CLOUDFLARE_PROEF_TOKEN: ${{ secrets.CLOUDFLARE_PROEF_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
          GH_TOKEN: ${{ secrets.BEHEER_GH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_TEAM_DOMAIN }}
          CLOUDFLARE_IDP_IDS: ${{ vars.CLOUDFLARE_IDP_IDS }}
          CLOUDFLARE_GROEPEN_IDP: ${{ vars.CLOUDFLARE_GROEPEN_IDP }}
          # Optioneel: met een DSN zet de inrichting Sentry aan in de app.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Alleen voor een klantportaal ("klantportaal": true in toegang.json): de sleutel
          # van Resend voor de inlogmail en de geheime sleutel van de Turnstile-widget.
          # Zonder klantportaal mogen ze ontbreken (leeg); het script eist ze alleen dan.
          SMTP_WACHTWOORD: ${{ secrets.SMTP_WACHTWOORD }}
          TURNSTILE_GEHEIM: ${{ secrets.TURNSTILE_GEHEIM }}
          # Invoer via de omgeving, nooit rechtstreeks in het script: zo kan een
          # waarde geen shell-opdracht worden.
          APP: ${{ inputs.app }}
          DROOGLOOP: ${{ inputs.droogloop }}
          OPRUIMEN: ${{ inputs.opruimen }}
          TWEEDE_DOORGANG: ${{ inputs.tweede_doorgang }}
          DEUR_WEGHALEN: ${{ inputs.deur_weghalen }}
        run: |
          # Het voorvoegsel is verplicht; cf-proef- is dat van de proef en de enige
          # waarmee het script op deze repo (GITHUB_REPOSITORY) mag terugvallen.
          args=(--voorvoegsel cf-proef- --app "$APP")
          if [ "$DROOGLOOP" = "true" ]; then args+=(--droogloop); fi
          if [ "$OPRUIMEN" = "true" ]; then args+=(--opruimen); fi
          if [ "$TWEEDE_DOORGANG" = "true" ]; then args+=(--tweede-doorgang); fi
          if [ "$DEUR_WEGHALEN" = "true" ]; then args+=(--deur-weghalen); fi
          # Het script schrijft zelf een leesbare samenvatting bij de run (GITHUB_STEP_SUMMARY).
          node beheer/inrichten-cloudflare.mjs "${args[@]}"

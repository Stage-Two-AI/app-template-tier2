# TIJDELIJK, alleen op de branch uitgave/43 en weg voor de merge: de pull request is een concept,
# en dan draait de Kwaliteitspoort de browsertest niet. Dit draait hem toch, met extra uitvoer.
name: Tijdelijk - browsertest op concept

on:
  push:
    branches: ["uitgave/43"]

permissions:
  contents: read

concurrency:
  group: tijdelijk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: pnpm env:local
      - name: Wat draait er
        run: |
          docker ps --format '{{.Names}} {{.Image}}'
          auth=$(docker ps --format '{{.Names}}' | grep auth | head -n 1)
          docker exec "$auth" sh -c 'getent hosts host.docker.internal || cat /etc/hosts' || true
          docker exec "$auth" sh -c 'env | grep -E "KEYCLOAK_(ENABLED|URL|REDIRECT)|MAILER_(AUTOCONFIRM|OTP)|RATE_LIMIT|SMTP_MAX|SITE_URL|URI_ALLOW"' || true
      - name: RLS-tests
        run: pnpm test:rls
      - name: Auth-log na de RLS-tests
        if: always()
        run: |
          auth=$(docker ps --format '{{.Names}}' | grep auth | head -n 1)
          docker logs "$auth" 2>&1 | grep -v '"path":"/health"' | tail -n 80 | cut -c1-600
      - run: pnpm exec playwright install --with-deps chromium
        if: always()
      - name: End-to-end test
        if: always()
        run: pnpm test:e2e
      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tijdelijk-playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 3

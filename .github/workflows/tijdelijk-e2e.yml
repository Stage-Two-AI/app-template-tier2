# TIJDELIJK, alleen op de branch uitgave/43 en weg voor de merge: de pull request is een concept,
# en dan draait de Kwaliteitspoort de browsertest niet. Dit draait hem toch, met extra uitvoer.
# De leider van uitgave 43 haalt dit bestand en .github/tijdelijk/ weg; tot dan blijft het staan,
# zodat ook de volgende aanvaller het kan gebruiken.
name: Tijdelijk - browsertest op concept

on:
  push:
    branches: ["uitgave/43", "aanval/43-inlog-2"]

permissions:
  contents: read

concurrency:
  group: tijdelijk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: RLS-tests en browsertest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: pnpm env:local
      - name: Databasetypes lopen gelijk met het schema
        run: pnpm db:types:check
      - name: RLS-tests
        run: pnpm test:rls
      - name: Auth-log na de RLS-tests
        if: always()
        run: |
          auth=$(docker ps --format '{{.Names}}' | grep auth | head -n 1)
          docker logs "$auth" 2>&1 | grep -v '"path":"/health"' | tail -n 60 | cut -c1-600
      # Dezelfde database, nu met de schakelaar aan en de poort op de voorbeeldtabel: de
      # controle op de database zelf (tests/rls/open-policies.test.ts) moet dan groen zijn.
      - name: Klantportaal aan - de poort in de echte database
        if: always()
        run: |
          psql "$(grep '^SUPABASE_DB_URL=' .env.test | cut -d= -f2-)" -v ON_ERROR_STOP=1 -c \
            'create policy "items_poort" on public.items as restrictive for all to authenticated using (public.is_medewerker() or public.is_goedgekeurde_klant())'
          cp stack.config.json "$RUNNER_TEMP/stack.config.json"
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("stack.config.json","utf8"));c.klantportaal=true;fs.writeFileSync("stack.config.json",JSON.stringify(c,null,2))'
          pnpm exec vitest run --config vitest.rls.config.ts tests/rls/open-policies.test.ts
          cp "$RUNNER_TEMP/stack.config.json" stack.config.json
          psql "$(grep '^SUPABASE_DB_URL=' .env.test | cut -d= -f2-)" -v ON_ERROR_STOP=1 -c 'drop policy "items_poort" on public.items'
      - run: pnpm exec playwright install --with-deps chromium
        if: always()
      - name: End-to-end test
        if: always()
        run: pnpm test:e2e
      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tijdelijk-playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  # Alleen als de commit erom vraagt (het woord "mutaties" in de boodschap): dit duurt lang.
  mutaties:
    name: Mutaties op de migratie
    if: contains(github.event.head_commit.message, 'mutaties')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: pnpm env:local
      - name: Mutaties
        run: node tests/rls/aanval2-mutaties-migratie.mjs a0-geen a1-goedgekeurd-sessie-van-ander a3-zoekpad-weg

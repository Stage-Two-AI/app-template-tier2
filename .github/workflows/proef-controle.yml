name: Proef controle van buitenaf

# Kijkt van buitenaf, zonder inlog, of de deur dicht zit: de app, het workers.dev-adres en de
# vaste preview, en de inlogroute van Supabase. Bij een klantportaal andersom voor het domein:
# dat hoort open te zijn, de rest dicht. De adressen zoekt het script zelf op (het domein uit
# wrangler.jsonc, de rest bij Cloudflare en Supabase), zodat niemand iets hoeft te typen.
# Wijzigt niets. Alleen met de hand te starten, alleen vanaf main. Zie beheer/README.md.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Naam van de app in beheer/toegang.json
        type: string
        default: cf-proef

concurrency:
  group: proef-beheer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controle:
    name: Controle van buitenaf
    # Alleen in de template zelf, net als Proef inrichten.
    if: github.repository == 'Stage-Two-AI/app-template-tier2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: proef-beheer
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Controle van buitenaf
        env:
          # Alleen om de adressen op te zoeken (lezen); de controle zelf gebruikt geen sleutel
          # behalve de openbare sleutel van Supabase.
          CLOUDFLARE_PROEF_TOKEN: ${{ secrets.CLOUDFLARE_PROEF_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_TEAM_DOMAIN }}
          # Invoer via de omgeving, nooit rechtstreeks in het script.
          APP: ${{ inputs.app }}
        run: |
          set -o pipefail
          # Rood als een controle zakt; het rapport staat ook in de samenvatting van de run.
          node beheer/controle-doorsteek.mjs --voorvoegsel cf-proef- --app "$APP" | tee -a "$GITHUB_STEP_SUMMARY"

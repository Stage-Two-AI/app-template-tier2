name: Proef controle van buitenaf

# Kijkt van buitenaf, zonder inlog, of de deur dicht zit: de app, het workers.dev-adres en de
# vaste preview (elk de voorpagina en een willekeurig diep pad), de inlogroute van Supabase en
# de openbare instellingen van de inlogdienst. Bij een klantportaal andersom voor het domein:
# dat hoort open te zijn, de rest dicht, met inloggen per mail en de captcha aan. De adressen
# zoekt het script zelf op (het domein uit wrangler.jsonc, de rest bij Cloudflare en Supabase),
# zodat niemand iets hoeft te typen. Wijzigt niets. Alleen met de hand te starten, alleen vanaf main. Zie beheer/README.md.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Naam van de app in beheer/toegang.json
        type: string
        default: cf-proef

concurrency:
  # Een eigen groep: deze workflow wijzigt niets en hoeft nergens op te wachten. In de groep
  # van de inrichting zou een druk op deze knop een wachtende Toegang bijwerken vervangen
  # (GitHub bewaart per groep één wachtende run), en dan wordt er niet ingetrokken.
  group: proef-controle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controle:
    name: Controle van buitenaf
    # Alleen in de template zelf, net als Proef inrichten.
    if: github.repository == 'Stage-Two-AI/app-template-tier2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: proef-beheer
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Controle van buitenaf
        env:
          # Alleen om de adressen op te zoeken, en alleen lezen:
          #  - CLOUDFLARE_PROEF_TOKEN: het workers.dev-subdomein van het account (daarmee
          #    weet het script welk workers.dev-adres en welke preview dicht horen te zijn);
          #  - SUPABASE_ACCESS_TOKEN en SUPABASE_ORG_SLUG: het project van de app vinden en
          #    zijn openbare sleutel lezen. De service-role-sleutel haalt het script niet op.
          # De controle zelf gebruikt alleen die openbare sleutel. Geen sleutel voor GitHub,
          # geen SMTP_WACHTWOORD en geen TURNSTILE_GEHEIM: die heeft lezen niet nodig.
          CLOUDFLARE_PROEF_TOKEN: ${{ secrets.CLOUDFLARE_PROEF_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_TEAM_DOMAIN }}
          # Invoer via de omgeving, nooit rechtstreeks in het script.
          APP: ${{ inputs.app }}
        run: |
          # Rood als een controle zakt. Het rapport schrijft het script zelf naar de
          # samenvatting van de run (GITHUB_STEP_SUMMARY); stdout wordt nergens heen geleid.
          # De tabel proef_zonder_grant bestaat alleen in de proef.
          node beheer/controle-doorsteek.mjs --voorvoegsel cf-proef- --app "$APP" --tabel proef_zonder_grant

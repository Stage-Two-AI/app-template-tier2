name: Droogloop migraties

# Oefent de migraties van een pull request die bestaande gegevens omzetten (UPDATE of
# DELETE) op de testdatabase, een kopie van productie, en draait alles daarna terug. Per
# migratie telt hij hoeveel rijen hij per tabel raakt en vergelijkt dat met de regels
# `-- verwachting: <tabel> <min>-<max>` bovenin de migratie. Buiten het bereik, of een tabel
# die er niet bij staat: de status "Droogloop migraties" op de PR is rood. De tellingen en
# vijf voorbeelden voor en na komen als reactie in de PR, als verslag voor later.
#
# Waarom niet in de Kwaliteitspoort zelf: die draait op de code van de PR, en code uit een
# PR krijgt nooit een sleutel. Deze workflow draait na "Droogloop aanvragen", altijd in de
# versie van main (zo werkt workflow_run). De migraties uit de PR zijn hier alleen gegevens:
# ze worden met git uitgelezen en als tekst naar de database gestuurd (scripts/droogloop.mjs),
# er draait geen code uit de PR op deze runner.
#
# Nodig in omgeving preview: het secret SUPABASE_TEST_DB_PASSWORD en de variabele
# SUPABASE_TEST_POOLER_HOST (of SUPABASE_POOLER_HOST). Ontbreken ze, dan zegt de reactie in
# de PR dat de droogloop niet kon draaien.
on:
  workflow_run:
    workflows: [Droogloop aanvragen]
    types: [completed]

concurrency:
  group: droogloop-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  droogloop:
    name: Droogloop op de testdatabase
    # Alleen een PR uit deze repo: een fork krijgt geen droogloop.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: PR-nummer bepalen
        id: pr
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::notice::Deze run hoort niet bij een pull request uit deze repo. Er komt geen droogloop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "nummer=$PR" >> "$GITHUB_OUTPUT"
          fi

      # De code van main; de PR levert alleen zijn migratiebestanden, als tekst.
      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Migraties van de PR klaarzetten
        id: klaar
        if: steps.pr.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAP: ${{ runner.temp }}/droogloop
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          node scripts/droogloop.mjs klaarzetten

      - name: Is de testdatabase bereikbaar?
        id: check
        if: steps.klaar.outputs.nodig == 'true'
        env:
          TEST_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
        run: |
          testref=$(node -e "import('./scripts/lib/stack-config.mjs').then((m) => console.log(m.testDatabase()?.project_ref ?? ''))")
          if [ -z "$testref" ]; then
            echo "::notice::Deze app heeft geen testdatabase (blok testdatabase in stack.config.json). De droogloop kan niet draaien."
            echo "reden=Deze app heeft geen testdatabase (blok testdatabase in stack.config.json)." >> "$GITHUB_OUTPUT"
            echo "doen=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TEST_DB_PASSWORD" ]; then
            echo "::warning::Het secret SUPABASE_TEST_DB_PASSWORD ontbreekt in omgeving preview. De droogloop kan niet draaien; App inrichten zet het."
            echo "reden=Het secret SUPABASE_TEST_DB_PASSWORD ontbreekt in omgeving preview; App inrichten zet het." >> "$GITHUB_OUTPUT"
            echo "doen=false" >> "$GITHUB_OUTPUT"
          else
            echo "testref=$testref" >> "$GITHUB_OUTPUT"
            echo "doen=true" >> "$GITHUB_OUTPUT"
          fi

      # Het adres bouwt scripts/db-url.mjs, zoals in deploy-db.yml: eerst het masker voor het
      # gecodeerde wachtwoord, dan pas het adres. Het staat alleen in deze stap.
      - name: Droogloop
        id: droog
        if: steps.check.outputs.doen == 'true'
        env:
          PROJECT_REF: ${{ steps.check.outputs.testref }}
          WACHTWOORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
          POOLER: ${{ vars.SUPABASE_TEST_POOLER_HOST || vars.SUPABASE_POOLER_HOST }}
          MAP: ${{ runner.temp }}/droogloop
        run: |
          node scripts/db-url.mjs --mask
          DROOGLOOP_DB_URL=$(node scripts/db-url.mjs)
          export DROOGLOOP_DB_URL
          node scripts/droogloop.mjs uitvoeren

      - name: Uitslag in de PR
        if: always() && steps.klaar.outputs.nodig == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.nummer }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DOEN: ${{ steps.check.outputs.doen }}
          REDEN: ${{ steps.check.outputs.reden }}
          GESLAAGD: ${{ steps.droog.outputs.geslaagd }}
          SAMENVATTING: ${{ steps.droog.outputs.samenvatting }}
          MAP: ${{ runner.temp }}/droogloop
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          markering='<!-- droogloop -->'
          if [ "$DOEN" = "true" ] && [ -f "$MAP/verslag.md" ]; then
            tekst=$(cat "$MAP/verslag.md")
          elif [ "$DOEN" = "true" ]; then
            tekst="$markering
          **Droogloop op de testdatabase**: kon niet draaien. Zie $RUN_URL"
          else
            tekst="$markering
          **Droogloop op de testdatabase**: niet gedraaid. $REDEN"
          fi
          # Eén reactie per PR, die bij elke push wordt bijgewerkt.
          bestaand=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$markering\")) | .id" | head -n 1)
          if [ -n "$bestaand" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$bestaand" -f body="$tekst" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$tekst" > /dev/null
          fi
          # De status op de commit van de PR: rood buiten de verwachting.
          if [ "$DOEN" = "true" ]; then
            if [ "$GESLAAGD" = "true" ]; then staat=success
            elif [ "$GESLAAGD" = "false" ]; then staat=failure
            else staat=error; SAMENVATTING="de droogloop kon niet draaien"; fi
            gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$staat" \
              -f context="Droogloop migraties" -f description="${SAMENVATTING:0:139}" \
              -f target_url="$RUN_URL" > /dev/null
          fi

      - name: Rood buiten de verwachting
        if: steps.droog.outputs.geslaagd == 'false'
        env:
          SAMENVATTING: ${{ steps.droog.outputs.samenvatting }}
        run: |
          echo "::error::Droogloop buiten de verwachting: $SAMENVATTING"
          exit 1

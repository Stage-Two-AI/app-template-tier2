# TIJDELIJK, alleen op de branch aanval/43-inlog: draait de aanvalstests (aanval-*.test.ts) en
# de mutaties tegen een echte lokale Supabase. Wordt aan het eind van de aanval weer verwijderd.
name: Tijdelijk - aanval op de inlog

on:
  push:
    branches: ["aanval/43-inlog"]

permissions:
  contents: read

concurrency:
  group: tijdelijk-aanval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aanval:
    name: Aanvalstests (database, unit, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: pnpm env:local
      - name: Bestaande RLS-tests (uitgangspunt, moet groen zijn)
        run: pnpm exec vitest run --config vitest.rls.config.ts tests/rls/klantportaal.test.ts
      - name: AANVAL database doel 1 (groen = aanval gelukt)
        if: always()
        run: pnpm exec vitest run --config vitest.rls.config.ts tests/rls/aanval-medewerker.test.ts
      - name: AANVAL database doel 2 (groen = aanval gelukt)
        if: always()
        run: pnpm exec vitest run --config vitest.rls.config.ts tests/rls/aanval-klant.test.ts
      - name: AANVAL link, code en API, doelen 3, 4 en 6 (groen = aanval gelukt)
        if: always()
        run: pnpm exec vitest run --config vitest.rls.config.ts tests/rls/aanval-inloglink.test.ts
      - name: AANVAL inlogpagina in jsdom, doelen 3, 5 en 6 (groen = aanval gelukt)
        if: always()
        run: pnpm exec vitest run --config vitest.config.ts src/features/auth/aanval-inlogpagina.test.tsx
      - name: Auth-log
        if: always()
        run: |
          auth=$(docker ps --format '{{.Names}}' | grep auth | head -n 1)
          docker logs "$auth" 2>&1 | grep -v '"path":"/health"' | grep -iE '"level":"(error|warning)"|identities|callback' | tail -n 60 | cut -c1-500
      - run: pnpm exec playwright install --with-deps chromium
        if: always()
      - name: AANVAL in de browser, doelen 3 en 4 (groen = aanval gelukt)
        if: always()
        run: pnpm exec playwright test --project klantportaal e2e/aanval-klantportaal.spec.ts --reporter list --retries 0

  mutaties:
    name: Mutaties (doel 7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Meer mails per uur dan de 200 uit config.toml: elke mutatie draait de hele test opnieuw.
      - run: sed -i 's/^email_sent = 200/email_sent = 5000/' supabase/config.toml
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: pnpm env:local
      - name: Mutaties
        run: node tests/aanval-mutaties.mjs
